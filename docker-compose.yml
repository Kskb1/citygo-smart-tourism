services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-citygo}
      MYSQL_USER: ${MYSQL_USER:-citygo_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - citygo_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$${MYSQL_USER} -p$${MYSQL_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:-jdbc:mysql://mysql:3306/citygo?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-citygo_user}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      AMAP_API_KEY: ${AMAP_API_KEY}
      JWT_SECRET: ${JWT_SECRET}
      JWT_TTL_HOURS: ${JWT_TTL_HOURS:-24}
      CITYGO_TRIP_MAX_PLAN_JSON_BYTES: ${CITYGO_TRIP_MAX_PLAN_JSON_BYTES:-5242880}
      CITYGO_ADMIN_USERNAME: ${CITYGO_ADMIN_USERNAME:-admin}
      CITYGO_ADMIN_PASSWORD: ${CITYGO_ADMIN_PASSWORD}
      CITYGO_ADMIN_EMAIL: ${CITYGO_ADMIN_EMAIL:-admin@example.com}
      CITYGO_DEMO_USERS_ENABLED: ${CITYGO_DEMO_USERS_ENABLED:-false}
      TRAIN_PROVIDER: ${TRAIN_PROVIDER:-official_redirect}
      TRAIN_API_KEY: ${TRAIN_API_KEY:-}
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api/health | grep -q '\"status\"'"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  citygo_mysql_data:
