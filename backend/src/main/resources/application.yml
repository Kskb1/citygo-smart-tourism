server:
  port: 8080

spring:
  application:
    name: citygo-smart-tourism
  profiles:
    default: dev
  datasource:
    url: ${SPRING_DATASOURCE_URL:${MYSQL_URL:jdbc:mysql://localhost:3306/citygo?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}}
    username: ${SPRING_DATASOURCE_USERNAME:${MYSQL_USER:root}}
    password: ${SPRING_DATASOURCE_PASSWORD:${MYSQL_PASSWORD:}}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      initialization-fail-timeout: -1
      connection-timeout: 3000
  flyway:
    enabled: false
    baseline-on-migrate: true
    locations: classpath:db/migration
  sql:
    init:
      mode: never

amap:
  api-key: ${AMAP_API_KEY:}

amadeus:
  client-id: ${AMADEUS_CLIENT_ID:}
  client-secret: ${AMADEUS_CLIENT_SECRET:}
  env: ${AMADEUS_ENV:test}

train:
  provider: ${TRAIN_PROVIDER:official_redirect}
  third-party-key: ${TRAIN_API_KEY:}

citygo:
  http-timeout-seconds: ${CITYGO_HTTP_TIMEOUT_SECONDS:15}
  trip:
    max-plan-json-bytes: ${CITYGO_TRIP_MAX_PLAN_JSON_BYTES:5242880}
  security:
    jwt-secret: ${JWT_SECRET:dev-only-change-me-citygo-secret}
    token-ttl-hours: ${JWT_TTL_HOURS:24}
    admin-username: ${CITYGO_ADMIN_USERNAME:admin}
    admin-password: ${CITYGO_ADMIN_PASSWORD:}
    admin-email: ${CITYGO_ADMIN_EMAIL:admin@citygo.local}
    demo-users-enabled: ${CITYGO_DEMO_USERS_ENABLED:true}
  estimate:
    rule-version: "1.0"
    weekend-factor: 1.10
    short-notice-factor: 1.25
    normal-notice-factor: 1.00
    emergency-reserve-rate: 0.10
    flight:
      distance-bands:
        short: [300, 600]
        medium: [450, 1000]
        long: [650, 1500]
        extra-long: [900, 2200]
    train:
      high-speed-second-class-rate: 0.45
      high-speed-first-class-rate: 0.75
      normal-hard-seat-rate: 0.18
      normal-hard-sleeper-rate: 0.35
    hotel:
      city-tiers:
        city-tier-1: [北京, 上海, 广州, 深圳]
        city-tier-2: [成都, 武汉, 南京, 杭州, 西安, 重庆, 天津, 苏州]
        city-tier-3: []
      tiers:
        city-tier-1:
          economy: [250, 450]
          comfort: [400, 700]
          upscale: [650, 1200]
          luxury: [1000, 2500]
        city-tier-2:
          economy: [180, 350]
          comfort: [300, 550]
          upscale: [500, 900]
          luxury: [800, 1800]
        city-tier-3:
          economy: [120, 280]
          comfort: [220, 450]
          upscale: [400, 750]
          luxury: [650, 1400]
      fallback:
        economy: [150, 320]
        comfort: [280, 520]
        upscale: [450, 850]
        luxury: [700, 1600]
    food:
      levels:
        economy: [60, 100]
        standard: [100, 180]
        quality: [180, 350]
    local-transport:
      levels:
        public: [20, 50]
        mixed: [50, 120]
        taxi: [100, 250]
